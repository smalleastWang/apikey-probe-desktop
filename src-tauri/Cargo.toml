[package]
name = "apikey-probe-desktop"
version = "0.1.0"
description = "Local upstream API key and model probe desktop app"
authors = ["apikey-probe-desktop"]
edition = "2021"

[lib]
name = "apikey_probe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apikey-probe-core = { path = "../crates/probe-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
