name: CLI Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: apikey-probe-macos
            binary: apikey-probe
          - os: ubuntu-latest
            artifact: apikey-probe-linux
            binary: apikey-probe
          - os: windows-latest
            artifact: apikey-probe-windows
            binary: apikey-probe.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build CLI
        run: cargo build -p apikey-probe-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
